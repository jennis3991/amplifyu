<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Test</title>
</head>
<body style="padding:2rem;font-family:sans-serif;max-width:400px;margin:0 auto">
<textarea id="text" rows="4" style="width:100%;font-size:16px;padding:8px">Your voice is one of your most powerful professional tools. The way you speak shapes how others perceive your confidence, credibility and presence.</textarea>
<div style="display:flex;gap:12px;margin-top:1rem">
<button onclick="play()" style="flex:1;padding:12px;font-size:16px">Play</button>
<button onclick="pause()" style="flex:1;padding:12px;font-size:16px">Pause</button>
<button onclick="stop()" style="flex:1;padding:12px;font-size:16px">Stop</button>
</div>
<script>
let u;
function play(){stop();u=new SpeechSynthesisUtterance(document.getElementById('text').value);window.speechSynthesis.speak(u)}
function pause(){window.speechSynthesis.paused?window.speechSynthesis.resume():window.speechSynthesis.pause()}
function stop(){window.speechSynthesis.cancel()}
</script>
</body>
</html>
